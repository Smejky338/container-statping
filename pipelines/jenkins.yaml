kind: Pipeline
apiVersion: tekton.dev/v1beta1
metadata:
  name: cpt-jenkins-job
spec:
  params:
    - name: JENKINS_HOST_URL
      type: string
    - name: JOB_NAME
      type: string
    - description: 'Snapshot of the konflux application'
      name: SNAPSHOT
      type: string
      default: "default-value"
  tasks:
    - name: trigger-jenkins-job
      taskRef:
        resolver: "git"
        params:
        - name: url
          value: https://github.com/konflux-ci/tekton-integration-catalog.git
        - name: revision
          value: main
        - name: pathInRepo
          value: tasks/triggers/jenkins/0.1/trigger-jenkins-job.yaml
        # - name: token
        #   value: iperf-pat
        # - name: tokenKey
        #   value: iperf-pat
      params:
        - name: JENKINS_HOST_URL
          value: $(params.JENKINS_HOST_URL)
        - name: JOB_NAME
          value: $(params.JOB_NAME)
        - name: JENKINS_SECRETS
          value: my-jenkins-credentials
        - name: JOB_PARAMS
          value:
            - "KONFLUX_SNAPSHOT=$(params.SNAPSHOT)"


